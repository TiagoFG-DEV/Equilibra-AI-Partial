services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: model
      POSTGRES_PASSWORD: model
      POSTGRES_DB: model
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U model -d model"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://model:model@postgres:5432/model?schema=public
      REDIS_URL: redis://redis:6379
      SKILLS_DIR: /app/skills
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./skills:/app/skills:ro

volumes:
  pgdata:
