<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equilibra — Simulador WhatsApp NR-1 & LGPD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --wa-bg-dark: #0c1317;
      --wa-header: #202c33;
      --wa-incoming: #202c33;
      --wa-outgoing: #005c4b;
      --wa-text-primary: #e9edef;
      --wa-text-secondary: #8696a0;
      --wa-green: #25d366;
      --wa-border: #222d34;
      --wa-input-bg: #2a3942;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0b0f19;
      color: var(--wa-text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* BARRA SUPERIOR DE CONTEXTO E CONFIGURAÇÃO */
    .top-nav {
      width: 100%;
      max-width: 860px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .nav-title {
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
    }

    .nav-links a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      background: #1e293b;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      transition: background 0.15s;
    }

    .nav-links a:hover {
      background: #334155;
    }

    /* SIMULADOR CONTAINER DO SMARTPHONE / WHATSAPP */
    .phone-mockup {
      width: 100%;
      max-width: 860px;
      height: 820px;
      background: var(--wa-bg-dark);
      border-radius: 18px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    /* WHATSAPP HEADER */
    .wa-header {
      background: var(--wa-header);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--wa-border);
    }

    .wa-profile {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .wa-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7 0%, #0d9488 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
      font-size: 16px;
    }

    .wa-name-group h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--wa-text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .verified-badge {
      background: #0284c7;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .wa-status {
      font-size: 12px;
      color: var(--wa-green);
    }

    .wa-sim-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wa-sim-input, .wa-sim-select {
      background: #111b21;
      border: 1px solid #334155;
      color: #e2e8f0;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 6px;
      outline: none;
    }

    /* ÁREA DE MENSAGENS COM FUNDO DO WHATSAPP */
    .wa-messages-area {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: #0b141a;
      background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .wa-bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      line-height: 1.5;
      position: relative;
      white-space: pre-wrap;
    }

    .wa-bubble.incoming {
      align-self: flex-start;
      background: var(--wa-incoming);
      color: var(--wa-text-primary);
      border-top-left-radius: 0;
    }

    .wa-bubble.outgoing {
      align-self: flex-end;
      background: var(--wa-outgoing);
      color: #fff;
      border-top-right-radius: 0;
    }

    .wa-time {
      font-size: 10px;
      color: var(--wa-text-secondary);
      float: right;
      margin-left: 10px;
      margin-top: 4px;
    }

    .wa-bubble.outgoing .wa-time {
      color: #a7f3d0;
    }

    /* ATALHOS RÁPIDOS E COMANDOS DO DOCUMENTO (SEÇÃO 7) */
    .wa-shortcuts-bar {
      background: #111b21;
      padding: 8px 16px;
      border-top: 1px solid var(--wa-border);
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
    }

    .shortcut-label {
      font-size: 11px;
      color: var(--wa-text-secondary);
      white-space: nowrap;
      text-transform: uppercase;
      font-weight: 600;
    }

    .chip-btn {
      background: #202c33;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .chip-btn:hover {
      background: #005c4b;
      color: #fff;
      border-color: #005c4b;
    }

    /* BARRA DE ENTRADA DO WHATSAPP */
    .wa-footer {
      background: var(--wa-header);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid var(--wa-border);
    }

    .wa-input {
      flex: 1;
      background: var(--wa-input-bg);
      border: none;
      outline: none;
      padding: 10px 16px;
      border-radius: 8px;
      color: var(--wa-text-primary);
      font-size: 13.5px;
      font-family: inherit;
    }

    .wa-btn-send {
      background: #00a884;
      border: none;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .wa-btn-send:hover {
      background: #02906f;
    }
  </style>
</head>
<body>

  <!-- BARRA DE NAVEGAÇÃO -->
  <div class="top-nav">
    <div class="nav-title">
      Equilibra | Portabilidade WhatsApp Business (NR-1 & LGPD)
    </div>
    <div class="nav-links">
      <a href="/conectar-whatsapp.html" style="background: #25d366; color: #0b141a; font-weight: 700; border-color: #25d366;">Conectar WhatsApp Real (QR Code)</a>
      <a href="/">← Voltar ao Painel Geral de RH</a>
    </div>
  </div>

  <!-- CONTAINER ESTILO WHATSAPP -->
  <div class="phone-mockup">
    
    <!-- HEADER DO WHATSAPP -->
    <header class="wa-header">
      <div class="wa-profile">
        <div class="wa-avatar">EQ</div>
        <div class="wa-name-group">
          <h2>
            Equilibra RH
            <span class="verified-badge">Oficial</span>
          </h2>
          <div class="wa-status">Canal de Escuta NR-1 • Conta Comercial Verificada</div>
        </div>
      </div>

      <!-- CONFIGURAÇÃO DA SIMULAÇÃO (TELEFONE E DEPARTAMENTO) -->
      <div class="wa-sim-bar">
        <input type="text" id="phoneInput" class="wa-sim-input" value="+5511987654321" title="Número de telefone simulado">
        <select id="deptInput" class="wa-sim-select">
          <option value="Operações">Operações</option>
          <option value="Comercial">Comercial</option>
          <option value="Tecnologia">Tecnologia</option>
          <option value="Atendimento">Atendimento</option>
        </select>
        <button class="chip-btn" id="btnRestart">Novo Convite</button>
      </div>
    </header>

    <!-- MENSAGENS -->
    <main class="wa-messages-area" id="messagesArea">
      <!-- Injetado dinamicamente -->
    </main>

    <!-- ATALHOS RÁPIDOS DA JORNADA DO WHATSAPP (SEÇÃO 7 DO PDF) -->
    <div class="wa-shortcuts-bar">
      <span class="shortcut-label">Consentimento:</span>
      <button class="chip-btn" data-send="1">1. Participar</button>
      <button class="chip-btn" data-send="2">2. Saber mais</button>
      <button class="chip-btn" data-send="3">3. Não participar</button>

      <span class="shortcut-label" style="margin-left: 10px;">Comandos LGPD:</span>
      <button class="chip-btn" data-send="meus dados">meus dados</button>
      <button class="chip-btn" data-send="apagar">apagar</button>
      <button class="chip-btn" data-send="pausar">pausar</button>
      <button class="chip-btn" data-send="sair">sair</button>
      <button class="chip-btn" data-send="ajuda">ajuda</button>

      <span class="shortcut-label" style="margin-left: 10px;">Notas:</span>
      <button class="chip-btn" data-send="Nota 10">10</button>
      <button class="chip-btn" data-send="Nota 8">8</button>
      <button class="chip-btn" data-send="Nota 5">5</button>
      <button class="chip-btn" data-send="Nota 3">3</button>
      <button class="chip-btn" data-send="Nota 0">0</button>
    </div>

    <!-- CAMPO DE DIGITAÇÃO -->
    <footer class="wa-footer">
      <input 
        type="text" 
        id="userInput" 
        class="wa-input" 
        placeholder="Digite uma mensagem, comando ou resposta..." 
        autocomplete="off"
      />
      <button class="wa-btn-send" id="btnSend">Enviar</button>
    </footer>

  </div>

  <script>
    const messagesArea = document.getElementById("messagesArea");
    const userInput = document.getElementById("userInput");
    const btnSend = document.getElementById("btnSend");
    const phoneInput = document.getElementById("phoneInput");
    const deptInput = document.getElementById("deptInput");
    const btnRestart = document.getElementById("btnRestart");

    // Iniciar com o convite oficial
    window.addEventListener("DOMContentLoaded", () => {
      sendInvitation();
    });

    btnRestart.addEventListener("click", () => {
      messagesArea.innerHTML = "";
      sendInvitation();
    });

    async function sendInvitation() {
      const phoneNumber = phoneInput.value.trim();
      const department = deptInput.value;

      try {
        const res = await fetch("/api/whatsapp/invite", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phoneNumber, department })
        });
        const data = await res.json();
        if (data.ok) {
          appendMessage("incoming", data.inviteText);
        }
      } catch (err) {
        console.error("Erro ao enviar convite:", err);
      }
    }

    function appendMessage(direction, text) {
      const bubble = document.createElement("div");
      bubble.className = `wa-bubble ${direction}`;
      
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      bubble.innerHTML = `${text}<span class="wa-time">${timeStr}</span>`;
      messagesArea.appendChild(bubble);
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    async function handleUserSend(text) {
      if (!text) return;
      appendMessage("outgoing", text);

      const phoneNumber = phoneInput.value.trim();
      const department = deptInput.value;

      try {
        const res = await fetch("/api/whatsapp/simulate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            phoneNumber,
            department,
            message: text
          })
        });

        const data = await res.json();
        if (data.ok && data.replyText) {
          appendMessage("incoming", data.replyText);
        }
      } catch (err) {
        appendMessage("incoming", "Erro de conexão ao simular mensagem no WhatsApp.");
      }
    }

    btnSend.addEventListener("click", () => {
      const text = userInput.value.trim();
      if (!text) return;
      userInput.value = "";
      handleUserSend(text);
    });

    userInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        btnSend.click();
      }
    });

    // Chips de atalho
    document.querySelectorAll(".chip-btn[data-send]").forEach(chip => {
      chip.addEventListener("click", () => {
        const cmd = chip.getAttribute("data-send");
        handleUserSend(cmd);
      });
    });
  </script>
</body>
</html>
